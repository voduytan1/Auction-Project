services:
  # Dịch vụ MySQL từ tệp gốc của bạn

  redis:
    image: redis:latest
    container_name: "Cache"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: [ "redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru" ]
    environment:
      REDIS_PASSWORD: ""
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - elk

  mysql_db:
    image: mysql:8.0
    container_name: my-mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: your_root_password
      MYSQL_DATABASE: database
      MYSQL_USER: your_app_user
      MYSQL_PASSWORD: your_app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
    networks:
      - elk

  # Dịch vụ Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.5
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false  # Disable SSL for easier setup
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
      - LOGSTASH_SYSTEM_PASSWORD=${LOGSTASH_SYSTEM_PASSWORD}
      - "ES_JAVA_OPTS=-Xms1024m -Xmx1024m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"' || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s
    networks:
      - elk

  es-init:
    image: alpine/curl:latest
    container_name: es-init
    volumes:
      - ./es-init/init-system-users.sh:/usr/local/bin/init-system-users.sh:ro
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
      - LOGSTASH_SYSTEM_PASSWORD=${LOGSTASH_SYSTEM_PASSWORD}
    # Add chmod to ensure script is executable
    command: sh -c "apk add --no-cache bash && bash /usr/local/bin/init-system-users.sh"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk

  # Dịch vụ Logstash
  logstash:
    image: docker.elastic.co/logstash/logstash:9.1.5
    container_name: logstash
    restart: on-failure
    environment:
      - ES_USER=elastic
      - ES_PWD=${ELASTIC_PASSWORD}
      - "ES_JAVA_OPTS=-Xms1024m -Xmx1024m"
    ports:
      - "5000:5000"
      - "9600:9600"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    depends_on:
      es-init:
        condition: service_completed_successfully
    networks:
      - elk

  # Dịch vụ Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.5
    container_name: kibana
    restart: on-failure
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200  # Changed to http
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=gJ_K9sL7R-aP9nF8tX_vCqY3zW1xU7oI
    depends_on:
      es-init:
        condition: service_completed_successfully
    networks:
      - elk

volumes:
  mysql_data:
  elasticsearch-data:
    driver: local
  redis-data:
    driver: local

networks:
  elk:
    driver: bridge